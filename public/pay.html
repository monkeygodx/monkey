<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark only" />
  <title>MONKEYGOD — Checkout</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=28" />
  <style>
    .pay-page {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 80px 1.5rem 3rem;
      position: relative;
      z-index: 1;
    }
    .pay-card {
      background: #141418;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 22px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 0 90px -20px rgba(147,51,234,.5);
      margin-top: 1rem;
    }
    .pay-back {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-size: .75rem;
      color: var(--text-dim);
      font-weight: 600;
      margin-bottom: 2rem;
      transition: color .2s;
      text-decoration: none;
    }
    .pay-back:hover { color: var(--purple-mid); }
    .pay-tier-name {
      font-size: .62rem;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--purple-light);
      font-family: ui-monospace, monospace;
      margin-bottom: .5rem;
    }
    .pay-title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -.03em;
      color: var(--text);
      margin-bottom: .25rem;
    }
    .pay-price {
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.04em;
      background: linear-gradient(140deg, #d4a8ff 0%, #8b2be2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: .3rem;
    }
    .pay-onetime {
      font-size: .6rem;
      color: var(--text-dim);
      font-weight: 700;
      font-family: ui-monospace, monospace;
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .pay-divider {
      height: 1px;
      background: rgba(255,255,255,.07);
      margin: 1.25rem 0;
    }
    .pay-methods-label {
      font-size: .55rem;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-family: ui-monospace, monospace;
      margin-bottom: .9rem;
    }

    /* ── Square card iframe container ── */
    #card-container {
      min-height: 88px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: .5rem .75rem;
      margin-bottom: 1rem;
      transition: border-color .2s;
    }
    #card-container:focus-within { border-color: rgba(147,51,234,.55); }

    /* ── Wallet buttons ── */
    /* Apple Pay native button — WebKit renders the actual Apple Pay UI */
    #apple-pay-button {
      display: none;
      -webkit-appearance: -apple-pay-button;
      -apple-pay-button-style: black;
      -apple-pay-button-type: plain;
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: .75rem;
    }
    /* Google Pay container — SDK injects the button here */
    #google-pay-container {
      margin-bottom: .75rem;
    }
    #google-pay-container iframe {
      border-radius: 8px !important;
    }

    .wallet-divider {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1rem;
      color: var(--text-dim);
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .06em;
    }
    .wallet-divider::before,
    .wallet-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,.08);
    }

    /* ── Buttons ── */
    .btn-pay {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      color: #fff;
      font-family: var(--font);
      font-size: .92rem;
      font-weight: 700;
      border-radius: var(--radius-btn);
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(147,51,234,.55);
      transition: filter .22s, transform .22s, box-shadow .22s;
      margin-bottom: .75rem;
      letter-spacing: .01em;
      text-decoration: none;
    }
    .btn-pay:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(147,51,234,.72);
    }
    .btn-pay:disabled { opacity: .5; cursor: wait; transform: none; filter: none; }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      background: rgba(255,255,255,.04);
      color: var(--text-muted);
      font-family: var(--font);
      font-size: .86rem;
      font-weight: 600;
      border-radius: var(--radius-btn);
      border: 1px solid rgba(255,255,255,.1);
      cursor: pointer;
      transition: background .2s, border-color .2s, color .2s;
      margin-bottom: .75rem;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,.09);
      border-color: rgba(255,255,255,.2);
      color: var(--text);
    }
    .btn-admin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      background: rgba(147,51,234,.07);
      color: var(--purple-mid);
      font-family: var(--font);
      font-size: .86rem;
      font-weight: 600;
      border-radius: var(--radius-btn);
      border: 1px solid rgba(147,51,234,.22);
      cursor: pointer;
      transition: background .2s, border-color .2s;
      text-decoration: none;
    }
    .btn-admin:hover { background: rgba(147,51,234,.14); border-color: rgba(147,51,234,.42); }

    /* ── Error / info boxes ── */
    .pay-error-box {
      background: rgba(220,38,38,.1);
      border: 1px solid rgba(220,38,38,.28);
      border-radius: 10px;
      padding: .85rem 1rem;
      font-size: .8rem;
      color: #fca5a5;
      margin-bottom: .9rem;
      line-height: 1.55;
      display: none;
    }
    .pay-info-box {
      background: rgba(147,51,234,.07);
      border: 1px solid rgba(147,51,234,.22);
      border-radius: 10px;
      padding: .85rem 1rem;
      font-size: .8rem;
      color: var(--text-muted);
      margin-bottom: .9rem;
      line-height: 1.55;
    }
    .pay-secure {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      font-size: .6rem;
      color: var(--text-dim);
      font-weight: 600;
      letter-spacing: .04em;
      margin-top: 1.25rem;
    }
    .pay-loading-msg {
      text-align: center;
      padding: 2rem 0 1rem;
      color: var(--text-dim);
      font-size: .84rem;
    }
    /* Promo code */
    .pay-promo { margin-bottom: 1rem; }
    .pay-promo-row {
      display: flex;
      gap: .5rem;
    }
    .pay-promo-input {
      flex: 1;
      height: 42px;
      padding: 0 .85rem;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 9px;
      color: var(--text);
      font-family: var(--font);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      outline: none;
      transition: border-color .2s;
    }
    .pay-promo-input::placeholder { text-transform: none; font-weight: 400; letter-spacing: 0; color: var(--text-dim); }
    .pay-promo-input:focus { border-color: rgba(147,51,234,.5); }
    .pay-promo-input:disabled { opacity: .55; cursor: not-allowed; }
    .pay-promo-btn {
      height: 42px;
      padding: 0 1rem;
      background: rgba(147,51,234,.12);
      border: 1px solid rgba(147,51,234,.3);
      border-radius: 9px;
      color: var(--purple-light);
      font-family: var(--font);
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .18s;
      flex-shrink: 0;
    }
    .pay-promo-btn:hover { background: rgba(147,51,234,.22); }
    .pay-promo-msg {
      font-size: .72rem;
      font-weight: 600;
      margin-top: .4rem;
      min-height: 1em;
    }
    .pay-promo-success { color: #86efac; }
    .pay-promo-invalid { color: #fca5a5; }
    /* Discount price display */
    .pay-price-wrap { display: flex; align-items: baseline; gap: .65rem; flex-wrap: wrap; margin-bottom: .3rem; }
    .pay-price-original {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-dim);
      text-decoration: line-through;
      line-height: 1;
    }
    .pay-discount-badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 .6rem;
      background: rgba(134,239,172,.12);
      border: 1px solid rgba(134,239,172,.3);
      border-radius: 6px;
      font-size: .55rem;
      font-weight: 900;
      letter-spacing: .1em;
      color: #86efac;
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>

  <div class="site-bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-glow-top"></div>
  </div>

  <header class="site-nav">
    <div class="nav-inner">
      <a class="nav-logo" href="/">MONKEYGOD</a>
      <a href="/" class="nav-cta">← Plans</a>
    </div>
  </header>

  <main class="pay-page">
    <div class="pay-card" id="pay-card">
      <div class="pay-loading-msg">Loading checkout…</div>
    </div>
  </main>

  <div id="toast" class="toast" hidden></div>

  <!-- Crypto modal -->
  <div id="crypto-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cr-title">
      <button class="modal-close" data-close>✕</button>
      <h3 id="cr-title" class="modal-title">Pay with Crypto</h3>
      <p class="modal-sub">Send <b id="cr-amount">—</b> for <b id="cr-product">—</b> to an address below. DM admin your TXID after sending.</p>
      <div id="crypto-list" class="crypto-list"></div>
      <a id="cr-admin" class="pay-btn pay-btn-card" href="#" target="_blank" rel="noopener">📨 Message Admin</a>
      <p class="co-fineprint">Double-check the network before sending. Wrong-network transfers can't be recovered.</p>
    </div>
  </div>

  <script>
    'use strict';
    const $ = s => document.querySelector(s);
    let CONFIG = null;
    let currentProduct = null;
    const VALID_PROMOS = { 'NEW': 0.10 };
    let appliedPromo = null;
    let discountedAmount = null;

    function toast(msg, ms) {
      const t = $('#toast');
      t.textContent = msg;
      t.hidden = false;
      clearTimeout(toast._t);
      toast._t = setTimeout(() => (t.hidden = true), ms || 3200);
    }
    function money(cents) {
      const d = cents / 100;
      return '$' + (Number.isInteger(d) ? d : d.toFixed(2));
    }
    function getTier() {
      const seg = window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
      if (['basic', 'premium', 'exclusive'].includes(seg)) return seg;
      const t = (new URLSearchParams(window.location.search).get('tier') || '').toLowerCase();
      return ['basic', 'premium', 'exclusive'].includes(t) ? t : null;
    }
    function loadScript(src) {
      return new Promise((res, rej) => {
        if (document.querySelector(`script[src="${src}"]`)) { res(); return; }
        const s = document.createElement('script');
        s.src = src;
        s.onload = res;
        s.onerror = () => rej(new Error('Failed to load Square SDK'));
        document.head.appendChild(s);
      });
    }
    function showErr(msg) {
      const el = $('#pay-error');
      if (!el) return;
      if (!msg) { el.style.display = 'none'; return; }
      el.textContent = msg;
      el.style.display = 'block';
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    const TIER_UI = {
      basic:     { label: 'Basic' },
      premium:   { label: 'Premium' },
      exclusive: { label: 'Exclusive' },
    };

    async function init() {
      const tier = getTier();
      if (!tier) { renderMsg('No tier selected.', 'Go back and pick a plan.', '/'); return; }

      try { CONFIG = await (await fetch('/api/config')).json(); }
      catch { renderMsg('Connection error.', 'Could not load checkout. Please refresh.', null); return; }

      const product = CONFIG.products?.[tier];
      if (!product) { renderMsg('Unknown tier.', null, '/'); return; }
      currentProduct = product;

      const td = TIER_UI[tier];
      const price = money(product.amount);
      const adminHref = CONFIG.links?.admin || '#';

      $('#pay-card').innerHTML = `
        <a class="pay-back" href="/">← Back to plans</a>
        <div class="pay-tier-name">${td.label}</div>
        <div class="pay-title">Complete Your Order</div>
        <div class="pay-price-wrap">
          <span class="pay-price" id="pay-price-display">${price}</span>
          <span class="pay-price-original" id="pay-price-original" style="display:none"></span>
          <span class="pay-discount-badge" id="pay-discount-badge" style="display:none">10% OFF</span>
        </div>
        <div class="pay-onetime">One-time · Lifetime access · Instant delivery</div>
        <div class="pay-promo">
          <div class="pay-promo-row">
            <input class="pay-promo-input" id="promo-input" type="text" placeholder="Promo code" maxlength="20" autocomplete="off" />
            <button class="pay-promo-btn" id="promo-apply">Apply</button>
          </div>
          <div class="pay-promo-msg" id="promo-msg"></div>
        </div>
        <div class="pay-divider"></div>
        <div class="pay-methods-label">Payment Method</div>
        <div id="pay-error" class="pay-error-box"></div>
        <div id="payment-area">
          <div class="pay-loading-msg">Setting up secure checkout…</div>
        </div>
        <div class="pay-divider" style="margin:.9rem 0"></div>
        <button class="btn-secondary" id="btn-crypto">₿ Pay with Crypto</button>
        <a class="btn-admin" href="${adminHref}" target="_blank" rel="noopener">📨 Message Admin</a>
        <div class="pay-secure">🔒 Encrypted checkout · One-time charge · No subscription</div>
      `;

      $('#btn-crypto').addEventListener('click', () => openCrypto(tier, product));
      wireCryptoModal();

      // Promo code
      const promoInput = $('#promo-input');
      const promoApply = $('#promo-apply');
      const promoMsg   = $('#promo-msg');

      function applyPromo() {
        const code = (promoInput.value || '').trim().toUpperCase();
        if (!code) return;
        const rate = VALID_PROMOS[code];
        if (!rate) {
          promoMsg.textContent = 'Invalid promo code.';
          promoMsg.className = 'pay-promo-msg pay-promo-invalid';
          return;
        }
        if (appliedPromo) {
          promoMsg.textContent = 'Code already applied.';
          promoMsg.className = 'pay-promo-msg pay-promo-invalid';
          return;
        }
        appliedPromo = code;
        discountedAmount = Math.round(product.amount * (1 - rate));
        const newPrice = money(discountedAmount);
        // Update price display
        $('#pay-price-original').textContent = price;
        $('#pay-price-original').style.display = 'inline';
        $('#pay-price-display').textContent = newPrice;
        $('#pay-discount-badge').style.display = 'inline-flex';
        // Update pay button if already rendered
        const btnPay = $('#btn-pay');
        if (btnPay && !btnPay.disabled) btnPay.innerHTML = `💳 Pay ${newPrice}`;
        promoMsg.textContent = `✓ Code "${code}" applied — ${Math.round(rate * 100)}% off!`;
        promoMsg.className = 'pay-promo-msg pay-promo-success';
        promoInput.disabled = true;
        promoApply.disabled = true;
      }

      promoApply.addEventListener('click', applyPromo);
      promoInput.addEventListener('keydown', e => { if (e.key === 'Enter') applyPromo(); });

      if (CONFIG.squareEmbedReady) {
        await initSquare(tier, product, price);
      } else {
        $('#payment-area').innerHTML =
          `<div class="pay-info-box">Card payments aren't live yet — use crypto or DM admin to arrange your order.</div>`;
      }
    }

    async function initSquare(tier, product, price) {
      const area = $('#payment-area');

      try {
        const sdkUrl = CONFIG.squareEnv === 'production'
          ? 'https://web.squarecdn.com/v1/square.js'
          : 'https://sandbox.web.squarecdn.com/v1/square.js';
        await loadScript(sdkUrl);

        const payments = Square.payments(CONFIG.squareAppId, CONFIG.squareLocationId);

        const payReq = payments.paymentRequest({
          countryCode: 'US',
          currencyCode: 'USD',
          total: { amount: (product.amount / 100).toFixed(2), label: product.name },
        });

        /* Build skeleton — Apple Pay is a native WebKit button, Google Pay attaches into its div */
        area.innerHTML = `
          <button id="apple-pay-button" lang="en" aria-label="Pay with Apple Pay"></button>
          <div id="google-pay-container"></div>
          <div id="wallet-sep"></div>
          <div id="card-container"></div>
          <button class="btn-pay" id="btn-pay">💳 Pay ${appliedPromo ? money(discountedAmount) : price}</button>
        `;

        let hasWallet = false;

        /* ── Apple Pay ──
           Square's applePay() returns an instance but has NO attach() method.
           Render the native WebKit button yourself and call tokenize() on click.
           Only fires in Safari on Apple devices with a card saved to Wallet.
        */
        let applePayInstance = null;
        try {
          applePayInstance = await payments.applePay(payReq);
          const apBtn = document.getElementById('apple-pay-button');
          apBtn.style.display = 'block';
          apBtn.addEventListener('click', async () => {
            showErr(null);
            try {
              const tokenResult = await applePayInstance.tokenize();
              if (tokenResult.status === 'OK') return submit(tier, tokenResult.token, price);
              showErr(tokenResult.errors?.[0]?.message || 'Apple Pay failed — try card.');
            } catch (e) {
              showErr('Apple Pay error: ' + e.message);
            }
          });
          hasWallet = true;
          console.log('[apple-pay] ready');
        } catch (e) {
          console.warn('[apple-pay] not available:', e.message,
            '— requires: Safari on iOS/macOS, production Square creds, verified domain');
        }

        /* ── Google Pay ──
           Square's googlePay() attaches a button into #google-pay-container.
           Only shows when the user has Google Pay configured in their browser.
           Requires production Square credentials + Square account verified for Google Pay.
        */
        try {
          const googlePay = await payments.googlePay(payReq);
          await googlePay.attach('#google-pay-container');
          googlePay.addEventListener('ontokenization', async (event) => {
            const { tokenResult } = event.detail;
            showErr(null);
            if (tokenResult.status === 'OK') return submit(tier, tokenResult.token, price);
            showErr(tokenResult.errors?.[0]?.message || 'Google Pay failed — try card.');
          });
          hasWallet = true;
          console.log('[google-pay] ready');
        } catch (e) {
          console.warn('[google-pay] not available:', e.message,
            '— requires: production Square creds, Square account verified for Google Pay');
        }

        if (hasWallet) {
          $('#wallet-sep').innerHTML = `<div class="wallet-divider">or pay by card</div>`;
        }

        /* ── Card form ── */
        const card = await payments.card({
          style: {
            '.input-container': { borderColor: 'rgba(255,255,255,.1)', borderRadius: '8px' },
            '.input-container.is-focus': { borderColor: 'rgba(147,51,234,.6)' },
            '.input-container.is-error': { borderColor: 'rgba(220,38,38,.55)' },
            input: {
              color: '#111111',
              fontSize: '14px',
            },
            'input::placeholder': { color: 'rgba(100,100,120,.6)' },
            '.message-text': { color: '#9ca3af' },
            '.message-icon': { color: '#9ca3af' },
          },
        });
        await card.attach('#card-container');

        /* Hide any processor branding injected into the DOM by the SDK */
        const hideProcessorBranding = () => {
          document.querySelectorAll('#card-container *').forEach(el => {
            if (!el.children.length && /square/i.test(el.textContent)) {
              el.style.cssText = 'display:none!important';
            }
          });
        };
        hideProcessorBranding();
        new MutationObserver(hideProcessorBranding).observe(
          document.getElementById('card-container'),
          { childList: true, subtree: true, characterData: true }
        );

        $('#btn-pay').addEventListener('click', async () => {
          const btn = $('#btn-pay');
          btn.disabled = true;
          btn.textContent = 'Processing…';
          showErr(null);
          try {
            const result = await card.tokenize();
            if (result.status !== 'OK') {
              showErr(result.errors?.[0]?.message || 'Check your card details and try again.');
              btn.disabled = false;
              btn.innerHTML = `💳 Pay ${price}`;
              return;
            }
            await submit(tier, result.token, price);
          } catch {
            showErr('Something went wrong. Please try again.');
            btn.disabled = false;
            btn.innerHTML = `💳 Pay ${price}`;
          }
        });

      } catch (e) {
        console.error('[checkout]', e);
        area.innerHTML = `
          <div class="pay-error-box" style="display:block">
            <strong>Checkout error:</strong> ${e?.message || e?.toString() || 'Unknown error'}
            <br><br>
            Check your environment variables in Railway match your payment processor credentials.
          </div>`;
      }
    }

    async function submit(tier, token, price) {
      const activePrice = appliedPromo ? money(discountedAmount) : price;
      try {
        const body = { tier, sourceId: token };
        if (appliedPromo) body.promoCode = appliedPromo;
        const res = await fetch('/api/charge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showErr(data.message || 'Payment declined. Try a different card or pay with crypto.');
          const btn = $('#btn-pay');
          if (btn) { btn.disabled = false; btn.innerHTML = `💳 Pay ${activePrice}`; }
          return;
        }
        window.location.href = data.redirect || `/success?tier=${encodeURIComponent(tier)}`;
      } catch {
        showErr('Network error. Please try again.');
        const btn = $('#btn-pay');
        if (btn) { btn.disabled = false; btn.innerHTML = `💳 Pay ${activePrice}`; }
      }
    }

    function openCrypto(tier, product) {
      $('#cr-amount').textContent = money(product.amount);
      $('#cr-product').textContent = product.name;
      if (CONFIG.links?.admin) $('#cr-admin').href = CONFIG.links.admin;
      const list = $('#crypto-list');
      list.innerHTML = '';
      if (!CONFIG.crypto?.length) {
        list.innerHTML = '<div class="crypto-empty">No addresses published yet.<br>Tap "Message Admin" below and they\'ll send you the current wallet address.</div>';
      } else {
        for (const c of CONFIG.crypto) {
          const row = document.createElement('div');
          row.className = 'crypto-row';
          row.innerHTML = `
            <div class="crypto-row-top">
              <div class="crypto-coin">${c.coin}<small>${c.label}</small></div>
              <button class="crypto-copy" data-addr="${c.address}">Copy</button>
            </div>
            <div class="crypto-addr">${c.address}</div>`;
          list.appendChild(row);
        }
        list.querySelectorAll('.crypto-copy').forEach(b =>
          b.addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(b.dataset.addr); toast('Address copied ✓'); }
            catch { toast('Copy failed — select manually'); }
          })
        );
      }
      $('#crypto-modal').hidden = false;
      document.body.style.overflow = 'hidden';
    }

    function wireCryptoModal() {
      document.querySelectorAll('[data-close]').forEach(b =>
        b.addEventListener('click', () => { $('#crypto-modal').hidden = true; document.body.style.overflow = ''; })
      );
      $('#crypto-modal').addEventListener('click', e => {
        if (e.target === $('#crypto-modal')) { $('#crypto-modal').hidden = true; document.body.style.overflow = ''; }
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { $('#crypto-modal').hidden = true; document.body.style.overflow = ''; }
      });
    }

    function renderMsg(title, body, href) {
      $('#pay-card').innerHTML = `
        <div style="text-align:center;padding:2rem 0">
          <div style="font-size:1.6rem;margin-bottom:1rem">⚠️</div>
          <p style="font-weight:800;color:var(--text);margin-bottom:.5rem">${title}</p>
          ${body ? `<p style="font-size:.82rem;color:var(--text-muted);line-height:1.6;margin-bottom:1.25rem">${body}</p>` : ''}
          ${href ? `<a class="btn-pay" href="${href}" style="max-width:200px;margin:0 auto;text-decoration:none">← Go Back</a>` : ''}
        </div>`;
    }

    init();
  </script>
</body>
</html>
