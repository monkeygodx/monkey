<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark only" />
  <title>MONKEYGOD | Checkout</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=11" />
</head>
<body>
  <div class="mesh-bg" aria-hidden="true"></div>

  <main class="content-container pay-page">

    <a class="pay-back" href="/">← Back</a>

    <!-- ── Order summary ── -->
    <div class="pay-card" id="checkout-card">
      <div class="order-summary">
        <span class="order-tier" id="order-tier">Loading…</span>
        <span class="order-amount" id="order-amount">—</span>
      </div>

      <!-- ── Discount code input ── -->
      <div style="margin-bottom: 1.4rem;">
        <div style="font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-bright); margin-bottom: 10px; font-weight: 600;">
          Discount Code
        </div>
        <div class="disc-field-wrap">
          <input
            id="disc-input"
            type="text"
            placeholder="Enter code (e.g. FUN)"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            maxlength="32"
          />
          <button id="disc-apply" type="button">Apply</button>
        </div>
        <div class="disc-status" id="disc-status"></div>
      </div>

      <!-- ── Wallet buttons (Apple Pay / Google Pay) ── -->
      <div id="wallet-container" class="wallet-container"></div>
      <div id="wallet-sep" class="wallet-sep" hidden>or pay by card</div>

      <!-- ── Card input ── -->
      <p class="pay-h">Card Details</p>
      <div id="card-container" class="card-container"></div>
      <p id="card-status" class="pay-note" style="text-align:center; margin-bottom: 0.9rem;"></p>

      <div id="pay-error" class="co-error" hidden></div>

      <button id="pay-btn" class="pay-btn pay-btn-card" disabled>
        <span id="pay-btn-text">Loading…</span>
      </button>

      <p class="co-fineprint" style="margin-top: 0.8rem;">
        🔒 Secured by Square &bull; One-time payment &bull; Instant access
      </p>
    </div>

    <!-- ── Success state ── -->
    <div class="resource-card" id="success-card" hidden>
      <h3>✅ Payment Confirmed</h3>
      <p>You're in. Click the link below to join your private channel — access is lifetime.</p>
      <a id="join-link" class="pay-btn pay-btn-card" href="#" target="_blank" rel="noopener">
        Join Your Channel →
      </a>
      <p class="co-fineprint" style="margin-top: 0.6rem;">
        Having trouble? <a href="https://t.me/cynski" target="_blank" rel="noopener" style="color:var(--accent-bright); text-decoration:none; font-weight:700;">DM @cynski</a>
      </p>
    </div>

  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="/pay.js?v=11"></script>
</body>
</html>
