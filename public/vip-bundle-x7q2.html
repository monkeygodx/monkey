<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark only" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>MONKEYGOD — Secret Access</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=29" />
  <style>
    /* This page has no announcement banner, so the shared --banner-h offset
       (which pushes .site-nav down to sit below the banner on other pages)
       would otherwise leave a floating gap above the nav here. Zero it out. */
    :root { --banner-h: 0px; }
    .teaser-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 1.5rem 3rem;
      position: relative;
      z-index: 1;
    }
    .teaser-card {
      background: #141418;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 22px;
      padding: 3rem 2.25rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 90px -20px rgba(147,51,234,.5);
    }
    .lock-badge {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: rgba(147,51,234,.12);
      border: 1px solid rgba(147,51,234,.3);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.4rem;
      font-size: 1.6rem;
    }
    .teaser-tag {
      font-size: .62rem; font-weight: 900; letter-spacing: .2em; text-transform: uppercase;
      color: var(--purple-light); font-family: ui-monospace, monospace; margin-bottom: .7rem;
    }
    .teaser-title {
      font-size: 1.7rem; font-weight: 900; letter-spacing: -.03em; color: var(--text);
      margin-bottom: .6rem; line-height: 1.15;
    }
    .teaser-price {
      font-size: 2.6rem; font-weight: 900; line-height: 1; letter-spacing: -.04em;
      background: linear-gradient(140deg, #d4a8ff 0%, #8b2be2 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: .4rem;
    }
    .teaser-sub {
      font-size: .86rem; color: var(--text-muted); line-height: 1.6;
      margin-bottom: 1.8rem;
    }
    .btn-join {
      display: flex; align-items: center; justify-content: center; width: 100%; height: 54px;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark)); color: #fff;
      font-family: var(--font); font-size: .95rem; font-weight: 700; border-radius: var(--radius-btn);
      border: none; cursor: pointer; box-shadow: 0 8px 28px rgba(147,51,234,.55);
      transition: filter .22s, transform .22s, box-shadow .22s; text-decoration: none; gap: .5rem;
    }
    .btn-join:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 14px 40px rgba(147,51,234,.72); }
    .teaser-secure {
      display: flex; align-items: center; justify-content: center; gap: .4rem;
      font-size: .6rem; color: var(--text-dim); font-weight: 600; margin-top: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="site-bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-glow-top"></div>
  </div>

  <header class="site-nav">
    <div class="nav-inner">
      <span class="nav-logo">MONKEYGOD</span>
    </div>
  </header>

  <main class="teaser-page">
    <div class="teaser-card">
      <div class="lock-badge">🔒</div>
      <div class="teaser-tag">Secret · Unlisted</div>
      <div class="teaser-title">$10 VIP Access</div>
      <div class="teaser-price" id="teaser-price">$10</div>
      <p class="teaser-sub">Tier 2 channel, one-time payment, instant invite. Not posted anywhere — you're seeing this because someone sent you the link.</p>
      <a class="btn-join" id="join-btn" href="https://mycheckout.live/?tier=mg_tier2bundle&amp;return=monkeygod.fun">Join Now — $10 →</a>
      <div class="teaser-secure">🔒 Secure checkout · One-time charge · No subscription</div>
    </div>
  </main>

  <script>
  'use strict';
  // Pull the live price from config so this page never goes stale if the
  // price changes — falls back to the static $10 already in the markup
  // if the request fails for any reason.
  (async function () {
    try {
      const cfg = await (await fetch('/api/config')).json();
      const amount = cfg?.products?.tier2bundle?.amountCents ?? cfg?.products?.tier2bundle?.amount;
      if (typeof amount === 'number') {
        const d = amount / 100;
        const price = '$' + (Number.isInteger(d) ? d : d.toFixed(2));
        document.getElementById('teaser-price').textContent = price;
        document.getElementById('join-btn').textContent = 'Join Now — ' + price + ' →';
      }
    } catch {}
  })();
  </script>
</body>
</html>
